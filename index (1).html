<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Queue">
<title>Smart Queue</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f7f7;--card:#fff;--ink:#10201f;--mute:#5f7170;--line:#e1e8e7;--pri:#0f766e;--pri2:#0b5a54;--onpri:#fff;--acc:#f59e0b;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--shadow:0 1px 3px rgba(16,32,31,.08),0 4px 14px rgba(16,32,31,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1514;--card:#142120;--ink:#e8f1f0;--mute:#93a8a6;--line:#243735;--pri:#2dd4bf;--pri2:#5eead4;--onpri:#06201d;--okbg:#14351f;--ok:#4ade80;--badbg:#3b1616;--bad:#f87171;--warnbg:#3a2a0c;--warn:#fbbf24;--infobg:#142a52;--info:#93c5fd;--shadow:none}}
:root[data-theme="dark"]{--bg:#0c1514;--card:#142120;--ink:#e8f1f0;--mute:#93a8a6;--line:#243735;--pri:#2dd4bf;--pri2:#5eead4;--onpri:#06201d;--okbg:#14351f;--ok:#4ade80;--badbg:#3b1616;--bad:#f87171;--warnbg:#3a2a0c;--warn:#fbbf24;--infobg:#142a52;--info:#93c5fd;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0}
main{flex:1;padding:6px 16px 96px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border:0}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{}
.hero .mute{color:inherit;opacity:.8}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mid{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h2{font-size:16px;margin:6px 0 0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;padding:13px 16px;border-radius:14px;border:0;background:var(--pri);color:var(--onpri);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-pending{background:var(--warnbg);color:var(--warn)}.p-arrived{background:var(--okbg);color:var(--ok)}.p-absent{background:var(--badbg);color:var(--bad)}.p-resched{background:var(--infobg);color:var(--info)}.p-free{background:var(--line);color:var(--mute)}.p-open{background:var(--okbg);color:var(--ok)}.p-closed{background:var(--line);color:var(--mute)}.p-cancelled{background:var(--badbg);color:var(--bad)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
.tab.on{color:var(--pri)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px;text-align:center}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slot{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.slot .num{background:var(--bg);border:1px solid var(--line);border-radius:12px;height:48px;display:grid;place-items:center;font-weight:800}
.slot b{display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;grid-column:1/-1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--mute)}
.empty{text-align:center;padding:36px 18px;color:var(--mute)}
.empty .ring{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--pri)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translate(-50%,-140%);transition:transform .25s;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;max-width:calc(100% - 24px);width:max-content;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:14px}
.logo{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:var(--onpri)}
.logo svg{width:46px;height:46px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri);width:22px;border-radius:8px}
.note{background:var(--infobg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13px}
.notif{display:flex;gap:10px}.notif.unread{border-left:4px solid var(--pri)}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.link{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;cursor:pointer;padding:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.userrow{display:flex;align-items:center;gap:10px;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--pri)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const K = 'smartqueue_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 10);
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toHM = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const f12 = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fShort = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const ago = ts => { const s = (Date.now() - ts) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };
const ic = n => ({
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  back: '<polyline points="15 18 9 12 15 6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  ticket: '<path d="M2 9a3 3 0 0 1 0 6v3a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-3a3 3 0 0 1 0-6V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z"/><line x1="13" y1="5" x2="13" y2="19"/>'
}[n] || '');
const svg = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic(n)}</svg>`;

/* ---------- data ---------- */
function mkSlots(qid, start, end, dur) {
  const out = []; let n = 1;
  for (let t = toMin(start); t + dur <= toMin(end); t += dur) out.push({ id: uid(), qid, n: n++, time: toHM(t), userId: null, status: 'pending', absentUser: null, reminded: false });
  return out;
}
function seed() {
  const now = new Date();
  const startMin = Math.ceil((now.getHours() * 60 + now.getMinutes() + 5) / 5) * 5;
  const maxStart = 21 * 60;
  const s = Math.min(startMin, maxStart);
  const day = isoDate(now);
  const sa = { id: 'u_super', name: 'Super Admin', email: 'super@smartqueue.app', phone: '08000000000', password: 'super123', role: 'super', active: true };
  const ad = { id: 'u_admin', name: 'Ngozi Admin', email: 'admin@smartqueue.app', phone: '08011111111', password: 'admin123', role: 'admin', active: true, by: 'u_super' };
  const u1 = { id: 'u_user', name: 'Demo User', email: 'user@smartqueue.app', phone: '08022222222', password: 'user123', role: 'user', active: true };
  const u2 = { id: 'u_amaka', name: 'Amaka Obi', email: 'amaka@example.com', phone: '08033333333', password: 'user123', role: 'user', active: true };
  const u3 = { id: 'u_tunde', name: 'Tunde Bello', email: 'tunde@example.com', phone: '08044444444', password: 'user123', role: 'user', active: true };
  const q = { id: 'q_demo', adminId: ad.id, name: 'Lagos Passport Office — Demo', venue: 'Ikoyi Passport Office', date: day, start: toHM(s), end: toHM(s + 180), dur: 15, status: 'open', allowResched: true, created: Date.now() };
  const slots = mkSlots(q.id, q.start, q.end, q.dur);
  slots[0].userId = u2.id; slots[1].userId = u1.id;
  return { users: [sa, ad, u1, u2, u3], queues: [q], slots, notifs: [], reqs: [], session: null, seenOnboard: false, notifOn: false };
}
function load() { try { const r = localStorage.getItem(K); if (r) return JSON.parse(r); } catch (e) {} return seed(); }
let DB = load();
function save() { try { localStorage.setItem(K, JSON.stringify(DB)); } catch (e) {} }

/* ---------- state ---------- */
const S = { r: 'splash', p: {}, stack: [], filter: 'all', pending: null, q: '' };
const cur = () => DB.users.find(u => u.id === DB.session && u.active) || null;
const userById = id => DB.users.find(u => u.id === id);
const queueById = id => DB.queues.find(q => q.id === id);
const slotsOf = qid => DB.slots.filter(s => s.qid === qid).sort((a, b) => a.n - b.n);
const slotStart = (q, s) => new Date(q.date + 'T' + s.time + ':00');
const unread = () => DB.notifs.filter(n => n.userId === DB.session && !n.read).length;
const homeFor = u => u.role === 'super' ? 'admins' : u.role === 'admin' ? 'dash' : 'home';

function go(r, p = {}, replace = false) { if (!replace) S.stack.push({ r: S.r, p: S.p }); S.r = r; S.p = p; S.filter = 'all'; S.q = ''; render(); window.scrollTo(0, 0); }
function tab(r) { S.stack = []; S.r = r; S.p = {}; S.filter = 'all'; render(); window.scrollTo(0, 0); }
function back() { const b = S.stack.pop(); if (b) { S.r = b.r; S.p = b.p; render(); } else { const u = cur(); tab(u ? homeFor(u) : 'signin'); } }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
function notify(userId, text) {
  DB.notifs.unshift({ id: uid(), userId, text, ts: Date.now(), read: false });
  if (userId === DB.session) {
    toast(text);
    try { if (DB.notifOn && 'Notification' in window && Notification.permission === 'granted') new Notification('Smart Queue', { body: text }); } catch (e) {}
  }
}

/* ---------- shell ---------- */
function tabsFor(u) {
  if (u.role === 'user') return [['home', 'Home', 'home'], ['myq', 'My Queue', 'ticket'], ['hist', 'History', 'clock'], ['notifs', 'Alerts', 'bell'], ['profile', 'Profile', 'user']];
  if (u.role === 'admin') return [['dash', 'Queues', 'list'], ['newq', 'New', 'plus'], ['notifs', 'Alerts', 'bell'], ['profile', 'Profile', 'user']];
  return [['admins', 'Admins', 'users'], ['overview', 'Overview', 'grid'], ['notifs', 'Alerts', 'bell'], ['profile', 'Profile', 'user']];
}
function shell(title, body, o = {}) {
  const u = cur();
  const tb = u && o.tabs !== false ? `<nav class="tabbar">${tabsFor(u).map(([k, l, i]) => `<button class="tab ${S.r === k || (o.tabOf === k) ? 'on' : ''}" data-act="tab" data-r="${k}">${svg(i)}${l}${k === 'notifs' && unread() ? `<span class="badge">${unread()}</span>` : ''}</button>`).join('')}</nav>` : '';
  return `<header class="top">${o.back ? `<button class="iconbtn" data-act="back" aria-label="Back">${svg('back')}</button>` : ''}<h1>${esc(title)}</h1>${o.right || ''}</header><main>${body}</main>${tb}`;
}
const empty = (icon, h, t) => `<div class="empty"><div class="ring">${svg(icon)}</div><b style="color:var(--ink)">${esc(h)}</b><div>${esc(t)}</div></div>`;
const pill = (cls, t) => `<span class="pill p-${cls}">${esc(t)}</span>`;

/* ---------- views ---------- */
const V = {};
V.splash = () => `<div class="center"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><h1 style="margin:0;font-size:30px;letter-spacing:-.02em">Smart Queue</h1><div class="mute">Right place. Right time.</div></div>`;

const SLIDES = [
  ['Skip the crowd', 'No more standing for hours. Get a time slot and show up only when it is your turn.', 'users'],
  ['Know your number', 'See your queue number, how many people are ahead of you, and a live countdown to your slot.', 'ticket'],
  ['Get a heads-up', 'We alert you 10 minutes before your turn, and instantly if anything changes.', 'bell']
];
V.onboard = () => {
  const i = S.p.i || 0, s = SLIDES[i];
  return `<div class="center" style="justify-content:space-between"><div style="width:100%;text-align:right"><button class="link" data-act="skip">Skip</button></div>
  <div><div class="logo" style="margin:0 auto 24px">${svg(s[2]).replace('class="ic"', 'class="ic" style="width:46px;height:46px"')}</div><h1 style="margin:0 0 10px;font-size:28px;letter-spacing:-.02em">${s[0]}</h1><p class="mute" style="font-size:15px;max-width:300px;margin:0 auto">${s[1]}</p></div>
  <div style="width:100%"><div class="dots">${SLIDES.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div style="height:18px"></div><button class="btn" data-act="next">${i === SLIDES.length - 1 ? 'Get started' : 'Next'}</button></div></div>`;
};

V.signin = () => `<div style="padding:28px 20px;display:flex;flex-direction:column;gap:6px">
  <div class="logo" style="width:64px;height:64px;border-radius:20px">${svg('clock').replace('class="ic"', 'class="ic" style="width:32px;height:32px"')}</div>
  <h1 style="margin:14px 0 2px;font-size:28px;letter-spacing:-.02em">Welcome back</h1><div class="mute">Sign in with your email or phone number. Admins and Super Admins use this same screen.</div>
  <label for="id">Email or phone</label><input id="id" autocomplete="username" inputmode="email" placeholder="you@example.com">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <div style="height:10px"></div><button class="btn" data-act="signin">Sign in</button>
  <div class="row" style="justify-content:center;margin-top:6px"><span class="mute">New here?</span><button class="link" data-act="goto" data-r="signup">Create account</button></div>
  <div class="card" style="margin-top:14px"><b>Demo accounts</b><div class="mute">Tap to fill the form</div>
  <div class="demo"><button class="chip" data-act="fill" data-i="user@smartqueue.app" data-p="user123">User</button><button class="chip" data-act="fill" data-i="admin@smartqueue.app" data-p="admin123">Admin</button><button class="chip" data-act="fill" data-i="super@smartqueue.app" data-p="super123">Super Admin</button></div></div></div>`;

V.signup = () => `<div style="padding:28px 20px">
  <button class="iconbtn" data-act="goto" data-r="signin" aria-label="Back">${svg('back')}</button>
  <h1 style="margin:14px 0 2px;font-size:28px;letter-spacing:-.02em">Create account</h1><div class="mute">Register as a user to receive queue slots.</div>
  <label for="nm">Full name</label><input id="nm" autocomplete="name">
  <label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">

function render() {

  if (!u && !open.includes(S.r)) S.r = 'signin';
  if (u && open.includes(S.r)) S.r = homeFor(u);
  if (u) { const allowed = { user: ['home', 'myq', 'hist', 'resched', 'notifs', 'profile', 'settings'], admin: ['dash', 'newq', 'editq', 'queue', 'assign', 'notifs', 'profile', 'settings'], super: ['admins', 'newadmin', 'overview', 'queue', 'notifs', 'profile', 'settings'] }[u.role]; if (!allowed.includes(S.r)) S.r = homeFor(u); }
  try { $('#app').innerHTML = (V[S.r] || V.signin)(); } catch (e) { console.error(e); $('#app').innerHTML = '<div class="center"><b>Something went wrong</b><button class="btn" onclick="location.reload()">Reload</button></div>'; }
  if (S.r === 'newq' || S.r === 'editq') { bindCalc(); calc(); }
  if (S.r === 'assign') { const i = $('#srch'); if (i) i.addEventListener('input', () => { $('#ulist').innerHTML = userList(userMatches(i.value)); }); }
  tick();
}
function calc() {
  const el = $('#calc'); if (!el) return;
  const s = $('#qs').value, e = $('#qe').value, d = +$('#qm').value;
  if (!s || !e || !d) { el.textContent = ''; return; }
  const n = Math.floor((toMin(e) - toMin(s)) / d);
  el.innerHTML = n > 0 ? `This creates <b style="color:var(--ink)">${n} slots</b> (${f12(s)} – ${f12(toHM(toMin(s) + n * d))}).` : 'End time must be later than start time by at least one slot.';
}
function bindCalc() { ['qs', 'qe', 'qm'].forEach(i => { const e = $('#' + i); if (e) e.addEventListener('input', calc); }); }
function cd(ms) { const t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (d ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s); }
function tick() { document.querySelectorAll('[data-cd]').forEach(e => { const l = +e.dataset.cd - Date.now(); e.textContent = l <= 0 ? "It's your turn" : cd(l); }); }
function reminders() {
  let ch = false;
  DB.slots.forEach(s => {
    if (!s.userId || s.reminded || !['pending', 'rescheduled'].includes(s.status)) return;
    const q = queueById(s.qid); if (!q || q.status !== 'open') return;
    const diff = slotStart(q, s) - Date.now();
    if (diff <= 10 * 60000 && diff > -5 * 60000) { s.reminded = true; ch = true; notify(s.userId, 'Your turn is in 10 minutes. Please head over now'); }
  });
  if (ch) { save(); const a = document.activeElement; if (!a || !['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) render(); }
}
setInterval(tick, 1000); setInterval(reminders, 15000);

/* ---------- actions ---------- */
const val = id => ($('#' + id)?.value ?? '').trim();
function assignSlot(slotId, userId) {
  const s = DB.slots.find(x => x.id === slotId), q = queueById(s.qid);
  const old = DB.slots.find(x => x.qid === s.qid && x.userId === userId && x.id !== slotId && ['pending', 'rescheduled'].includes(x.status));
  const prev = s.userId;
  if (old) { old.userId = null; old.status = 'pending'; old.reminded = false; }
  if (prev && prev !== userId) notify(prev, 'Your slot has been cancelled. Contact the organiser');
  s.userId = userId; s.status = 'pending'; s.absentUser = null; s.reminded = false;
  notify(userId, old || prev === userId ? `Your slot has been updated to ${f12(s.time)} (slot #${s.n}) on ${fShort(q.date)}` : `You have been given slot #${s.n} at ${f12(s.time)} on ${fShort(q.date)} — ${q.name}`);
}
function cancelQueue(q, text, status) {
  q.status = status; DB.slots.filter(s => s.qid === q.id && s.userId).forEach(s => notify(s.userId, text));
}
function getQForm() {
  const d = { name: val('qn'), venue: val('qv'), date: val('qd'), start: val('qs'), end: val('qe'), dur: +val('qm'), allowResched: $('#qr').checked };
  if (!d.name || !d.venue || !d.date || !d.start || !d.end || !d.dur) { toast('Please fill in every field'); return null; }
  if (d.date < isoDate(new Date())) { toast('Date cannot be in the past'); return null; }
  if (Math.floor((toMin(d.end) - toMin(d.start)) / d.dur) < 1) { toast('Time range is too short for one slot'); return null; }
  return d;
}
const A = {
  tab: d => tab(d.r), back, goto: d => go(d.r, { id: d.id }),
  skip() { DB.seenOnboard = true; save(); tab('signin'); },
  next() { const i = (S.p.i || 0) + 1; if (i >= SLIDES.length) A.skip(); else { S.p = { i }; render(); } },
  fill(d) { $('#id').value = d.i; $('#pw').value = d.p; },
  signin() {
    const id = val('id').toLowerCase(), pw = $('#pw').value, ph = id.replace(/\s/g, '');
    const u = DB.users.find(x => (x.email.toLowerCase() === id || x.phone.replace(/\s/g, '') === ph) && x.password === pw);
    if (!u) return toast('Incorrect email/phone or password');
    if (!u.active) return toast('This account has been deactivated');
    DB.session = u.id; save(); tab(homeFor(u)); reminders();
  },
  signup() {
    const nm = val('nm'), em = val('em').toLowerCase(), ph = val('ph'), pw = $('#pw').value;
    if (nm.length < 2) return toast('Enter your full name');
    if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Enter a valid email');
    if (ph.replace(/\D/g, '').length < 7) return toast('Enter a valid phone number');
    if (pw.length < 6) return toast('Password needs at least 6 characters');
    if (DB.users.some(u => u.email.toLowerCase() === em || u.phone.replace(/\s/g, '') === ph.replace(/\s/g, ''))) return toast('An account with that email or phone already exists');
    S.pending = { id: uid(), name: nm, email: em, phone: ph, password: pw, role: 'user', active: true, otp: String(Math.floor(100000 + Math.random() * 900000)) };
    go('otp', {}, true);
  },
  verify() {
    if (val('otp') !== S.pending.otp) return toast('That code is not correct');
    const { otp, ...u } = S.pending; DB.users.push(u); DB.session = u.id; S.pending = null; save(); toast('Welcome to Smart Queue!'); tab('home');
  },
  signout() { DB.session = null; save(); S.stack = []; S.r = 'signin'; render(); },
  saveprofile() { const u = cur(), nm = val('nm'), ph = val('ph'); if (nm.length < 2 || ph.replace(/\D/g, '').length < 7) return toast('Check your name and phone'); u.name = nm; u.phone = ph; save(); toast('Profile updated'); render(); },
  readall() { DB.notifs.forEach(n => { if (n.userId === DB.session) n.read = true; }); save(); render(); },
  async togglenotif() {
    if (DB.notifOn) { DB.notifOn = false; save(); return render(); }
    if (!('Notification' in window)) return toast('This browser does not support notifications');
    try { const r = await Notification.requestPermission(); DB.notifOn = r === 'granted'; toast(DB.notifOn ? 'Notifications enabled' : 'Permission was not granted'); } catch (e) { toast('Could not enable notifications'); }
    save(); render();
  },
  theme(d) { const r = document.documentElement; if (d.t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', d.t); },
  reset() { if (confirm('Reset all demo data on this device?')) { DB = seed(); save(); S.stack = []; S.r = 'signin'; render(); } },
  filter(d) { S.filter = d.f; render(); },
  /* user */
  sendresched(d) {
    const s = DB.slots.find(x => x.id === d.id), ns = val('ns'); if (!ns) return;
    DB.reqs.push({ id: uid(), slotId: s.id, newSlotId: ns, userId: s.userId, note: val('why'), status: 'pending' });
    const q = queueById(s.qid); notify(q.adminId, `${cur().name} requested to reschedule slot #${s.n}`);
    save(); toast('Request sent'); back();
  },
  /* admin */
  createq() {
    const d = getQForm(); if (!d) return;
    const q = { id: uid(), adminId: cur().id, status: 'open', created: Date.now(), ...d };
    DB.queues.push(q); DB.slots.push(...mkSlots(q.id, d.start, d.end, d.dur)); save(); toast('Queue created'); S.stack = []; go('queue', { id: q.id }, true);
  },
  saveq(d) {
    const q = queueById(d.id), f = getQForm(); if (!f) return;
    const locked = DB.slots.some(s => s.qid === q.id && s.userId);
    Object.assign(q, { name: f.name, venue: f.venue, date: f.date, allowResched: f.allowResched });
    if (!locked) { Object.assign(q, { start: f.start, end: f.end, dur: f.dur }); DB.slots = DB.slots.filter(s => s.qid !== q.id); DB.slots.push(...mkSlots(q.id, f.start, f.end, f.dur)); }
    DB.slots.filter(s => s.qid === q.id && s.userId).forEach(s => notify(s.userId, `Queue details updated: ${q.name} on ${fShort(q.date)}`));
    save(); toast('Queue updated'); back();
  },
  cancelq(d) { const q = queueById(d.id); if (!confirm('Cancel this queue? All assigned users will be notified.')) return; cancelQueue(q, `The event has been cancelled: ${q.name}`, 'cancelled'); save(); toast('Queue cancelled'); S.stack = []; tab(cur().role === 'admin' ? 'dash' : 'overview'); },
  closeq(d) { const q = queueById(d.id); if (!confirm('Mark this queue as complete?')) return; q.status = 'closed'; save(); toast('Queue closed'); render(); },
  deactq(d) { const q = queueById(d.id); if (!confirm('Deactivate this queue? Assigned users will be notified.')) return; cancelQueue(q, `The event has been cancelled: ${q.name}`, 'cancelled'); save(); toast('Queue deactivated'); render(); },
  arrive(d) { const s = DB.slots.find(x => x.id === d.id); s.status = 'arrived'; save(); render(); },
  absent(d) { const s = DB.slots.find(x => x.id === d.id), u = s.userId; s.status = 'absent'; s.absentUser = u; s.userId = null; notify(u, 'You were marked absent and your slot has been released. Contact the organiser'); save(); render(); },
  removeslot(d) { const s = DB.slots.find(x => x.id === d.id); if (!confirm('Remove this user from the slot?')) return; notify(s.userId, 'Your slot has been cancelled. Contact the organiser'); s.userId = null; s.status = 'pending'; s.reminded = false; save(); render(); },
  doassign(d) { const sid = val('sl'); assignSlot(sid, d.u); save(); toast('Slot assigned to ' + userById(d.u).name); back(); },
  approve(d) {
    const r = DB.reqs.find(x => x.id === d.id), o = DB.slots.find(s => s.id === r.slotId), n = DB.slots.find(s => s.id === r.newSlotId);
    if (!n || n.userId) return toast('That slot is no longer free. Reject, or reassign manually');
    o.userId = null; o.status = 'pending'; o.reminded = false; n.userId = r.userId; n.status = 'rescheduled'; n.reminded = false; r.status = 'approved';
    notify(r.userId, `Reschedule approved. Your new slot is #${n.n} at ${f12(n.time)}`); save(); render();
  },
  reject(d) { const r = DB.reqs.find(x => x.id === d.id); r.status = 'rejected'; notify(r.userId, 'Your reschedule request was rejected. Your original slot stands'); save(); render(); },
  /* super */
  makeadmin() {
    const nm = val('nm'), em = val('em').toLowerCase(), ph = val('ph'), pw = val('pw');
    if (nm.length < 2 || !/^\S+@\S+\.\S+$/.test(em) || ph.replace(/\D/g, '').length < 7) return toast('Check name, email and phone');
    if (pw.length < 6) return toast('Password needs at least 6 characters');
    if (DB.users.some(u => u.email.toLowerCase() === em)) return toast('That email is already registered');
    DB.users.push({ id: uid(), name: nm, email: em, phone: ph, password: pw, role: 'admin', active: true, by: DB.session }); save(); toast('Admin created'); back();
  },
  toggleadmin(d) {
    const a = userById(d.id); a.active = !a.active;
    if (!a.active) DB.queues.filter(q => q.adminId === a.id && q.status === 'open').forEach(q => cancelQueue(q, `The event has been cancelled: ${q.name}`, 'cancelled'));
    save(); toast(a.active ? 'Admin reactivated' : 'Admin deactivated'); render();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset);
});

/* mark alerts as read when viewing */
const _render = render;
render = function () { if (S.r === 'notifs' && DB.session) { const was = unread(); _render(); if (was) { setTimeout(() => { DB.notifs.forEach(n => { if (n.userId === DB.session) n.read = true; }); save(); const t = document.querySelector('.tab .badge'); if (t) t.remove(); }, 1200); } } else _render(); };

/* offline + install */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
/* boot */
render();
setTimeout(() => { if (S.r !== 'splash') return; const u = cur(); if (u) tab(homeFor(u)); else if (!DB.seenOnboard) { S.r = 'onboard'; S.p = { i: 0 }; render(); } else tab('signin'); reminders(); }, 1300);
</script>
